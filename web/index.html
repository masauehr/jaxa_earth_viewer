<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JAXA Earth 衛星データビューア</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css?v=6">
</head>
<body>
  <div id="map"></div>
  <div id="panel">
    <select id="dataset" aria-label="データセット"></select>
    <div class="row">
      <button id="prev" aria-label="前の日">◀</button>
      <select id="date"></select>
      <button id="next" aria-label="次の日">▶</button>
    </div>
    <div class="row">
      <button id="play" aria-label="再生">▶▶</button>
      <input type="range" id="slider" min="0" max="0" step="1" value="0">
    </div>
    <label class="row">透過度 <input type="range" id="opacity" min="0.1" max="1" step="0.05" value="0.8"></label>
    <div id="legend"></div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/app.js?v=6"></script>
</body>
</html>
